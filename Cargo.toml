[package]
name = "sevdesk"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jernoxit/sevdesk-rs"
publish = false
description = "Typed client for the sevDesk REST API, shaped by measurements against a real account."

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "multipart", "rustls"] }
metrics = "0.24"
serde = { version = "1", features = ["derive"] }
# `raw_value`: amounts are read from the source text of the JSON value, so a
# number such as `87.49` never passes through an f64.
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
base64 = "0.23.1"
# Decode errors name the field path (`[0].sumNet`).
serde_path_to_error = "0.1.20"

[dev-dependencies]
time = { version = "0.3", features = ["macros"] }
# `test-util`: paused time for the pacing unit tests.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
wiremock = "0.6"
# Completeness guard (tests/completeness/): every key a fixture carries and a read type ignores.
serde_ignored = "0.1.14"
# Spec watcher (tests/spec_watch/): parses the downloaded OpenAPI spec and checksums it.
serde_yaml_ng = "0.10"
sha2 = "0.11"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Writes PERMANENT documents to the test account: never part of a plain
# `cargo test`; run with `just test-live --test enshrine_matrix run1`.
[[test]]
name = "enshrine_matrix"
path = "tests/enshrine_matrix/main.rs"
test = false

# Writes PERMANENT documents to the test account: never part of a plain
# `cargo test`; run with
# `just test-live --test number_probe <filter> -- --nocapture --test-threads=1`.
[[test]]
name = "number_probe"
path = "tests/number_probe/main.rs"
test = false

# Writes PERMANENT documents to the test account: never part of a plain
# `cargo test`; run with
# `just test-live --test length_probe <filter> -- --nocapture --test-threads=1`.
[[test]]
name = "length_probe"
path = "tests/length_probe/main.rs"
test = false

# Writes PERMANENT documents to the test account: never part of a plain
# `cargo test`; run with `just test-live --test address_probe case1`.
[[test]]
name = "address_probe"
path = "tests/address_probe/main.rs"
test = false

# Only READS the test account (GET, after verifying the account); never part of
# a plain `cargo test`; run with `just test-live --test shape_survey survey_all`
# (`just test-live` appends `-- --ignored --nocapture` itself).
[[test]]
name = "shape_survey"
path = "tests/shape_survey/main.rs"
test = false

# Writes ONE permanent invoice draft to the test account; never part of a plain
# `cargo test`; run with `just test-live --test quantity_probe case1`
# (`just test-live` appends `-- --ignored --nocapture` itself).
[[test]]
name = "quantity_probe"
path = "tests/quantity_probe/main.rs"
test = false

# Keeps the target name `fixtures` (tests/fixtures/ holds the JSON recordings).
[[test]]
name = "fixtures"
path = "tests/decoding/main.rs"

# Compares a freshly downloaded OpenAPI spec with the read types and endpoints.
# Needs target/tmp/spec/openapi.yaml, so never part of a plain `cargo test`;
# run with `just spec-check`.
[[test]]
name = "spec_watch"
path = "tests/spec_watch/main.rs"
test = false
