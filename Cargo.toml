[package]
name = "sevdesk"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jernoxit/sevdesk-rs"
publish = false
description = "Typed client for the sevDesk REST API, shaped by measurements against a real account."

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "multipart", "rustls"] }
metrics = "0.24"
serde = { version = "1", features = ["derive"] }
# `raw_value`: amounts are read from the source text of the JSON value, so a
# number such as `87.49` never passes through an f64.
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
base64 = "0.23.1"

[dev-dependencies]
time = { version = "0.3", features = ["macros"] }
# `test-util`: paused time for the pacing unit tests.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
